name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Integration Continue = tests + build + generation rapports AUTO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # check runs "JUnit Tests" et "Code Coverage"
      pull-requests: write # commentaires de couverture sur les PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (validation du wrapper + cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build & tests + rapport JaCoCo (XML + HTML)
        run: ./gradlew build jacocoTestReport

      - name: Rapport de tests JUnit
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: JUnit Tests
          path: build/test-results/test/TEST-*.xml
          reporter: java-junit

      - name: Rapport de couverture JaCoCo
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@v4.8
        if: success() || failure()
        with:
          coverage_results_path: build/reports/jacoco/test/jacocoTestReport.xml
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Couverture dans le résumé du job
        if: success() || failure()
        run: |
          echo "### Couverture de code (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "| Couverture | Lignes couvertes | Lignes manquées | Total |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ steps.jacoco_reporter.outputs.coverage_percentage }}% | ${{ steps.jacoco_reporter.outputs.covered_lines }} | ${{ steps.jacoco_reporter.outputs.missed_lines }} | ${{ steps.jacoco_reporter.outputs.total_lines }} |" >> $GITHUB_STEP_SUMMARY

      - name: Publication du rapport HTML JaCoCo (artifact)
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
